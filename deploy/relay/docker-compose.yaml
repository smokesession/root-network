version: '3.8'
services:
  relay:
    image: nebula-net:latest
    build:
      context: ../../
      dockerfile: Dockerfile
    # --data-dir is a global flag: it must come before the `node` subcommand.
    command: --data-dir /data node --addr 0.0.0.0:8443 --hostname ${HOSTNAME:-relay} --metrics-addr 0.0.0.0:9090
    environment:
      # Comma-separated seed peers to dial on startup, e.g. "1.2.3.4:8443,5.6.7.8:8443".
      # Leave empty for the first node in a network (nothing to bootstrap from yet).
      - BOOTSTRAP_NODES=${BOOTSTRAP_NODES:-}
      - RUST_LOG=info
    volumes:
      - ./data:/data
    ports:
      - "8443:8443"
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
