[package]
name = "root"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.22"
tokio-rustls = "0.25"
ed25519-dalek = { version = "2.0.0", features = ["serde", "rand_core"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rustls-pemfile = "0.3"
rcgen = "0.14"
time = { version = "0.3.31", features = ["std", "macros"] }
bincode = "1.3"
serde_bytes = "0.11"
rand = "0.8"
aes = "0.8"
ctr = "0.9"
base32 = "0.4"
clap = { version = "4.4", features = ["derive"] }
governor = "0.6"
nonzero_ext = "0.3"
