# Example exit policy for a Nebula/root relay node.
#
# Pass this file's path via `--exit-policy <path>` on `root ... node` to opt
# this relay into forwarding exit (Begin) traffic to the outside world.
#
# IMPORTANT: if you do NOT pass --exit-policy at all, the compiled-in default
# is reject-all -- the node runs relay-only (non-exit) and none of this file's
# rules matter unless you opt in.
#
# Format: one rule per line, evaluated top to bottom, first match wins.
#   accept <ip-or-cidr>:<port-or-*>
#   reject <ip-or-cidr>:<port-or-*>
# `#` starts a trailing comment. If nothing matches, the connection is
# rejected (implicit final reject) -- there is no need to add a catch-all
# reject rule, though one is included below for clarity.
#
# This is a *basic* policy engine: IPv4 exact addresses and CIDR ranges only
# (no IPv6, no hostnames, no Tor-style abbreviations like *:80,443). Adjust to
# taste for your own risk tolerance and abuse-reporting appetite.

# --- Never let this relay be used to reach itself or other local/private
# --- networks -- SSRF/pivoting protection.
reject 127.0.0.0/8:*
reject 10.0.0.0/8:*
reject 172.16.0.0/12:*
reject 192.168.0.0/16:*
reject 169.254.0.0/16:*
reject 0.0.0.0/8:*

# --- Common abuse-prone ports. Rejecting these is the single biggest thing
# --- you can do to keep this relay off abuse blocklists.
reject *:25    # SMTP -- avoid becoming an open spam relay
reject *:465   # SMTPS
reject *:587   # SMTP submission
reject *:23    # Telnet
reject *:135   # MS RPC
reject *:137   # NetBIOS
reject *:138   # NetBIOS
reject *:139   # NetBIOS / SMB
reject *:445   # SMB

# --- Everything else: allowed. Comment this out (and add your own narrower
# --- accept rules above) if you'd rather run a restricted, allowlist-only exit.
accept *:*
